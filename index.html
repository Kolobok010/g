<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <title>Mini veikals</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Mini veikals</h1>

    <form id="registerForm" class="register">
        <input type="text" id="name" placeholder="Vārds">
        <input type="email" id="mail" placeholder="E-pasts">
        <button>Reģistrēties</button>
        <span id="regMsg"></span>
    </form>
</header>


<main>

    <section class="shop">

        <div class="product">
            <label>Burkāni (1€)</label>
            <input type="number" id="carrot" min="0" value="0">
        </div>

        <div class="product">
            <label>Kartupeļi (2€)</label>
            <input type="number" id="potato" min="0" value="0">
        </div>

        <div class="product">
            <label>Āboli (3€)</label>
            <input type="number" id="apple" min="0" value="0">
        </div>

        <button id="calc">Aprēķināt summu</button>

        <div id="total" class="total"></div>

    </section>

</main>

<script src="script.js"></script>
</body>
</html>
