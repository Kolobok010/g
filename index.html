<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <title>Mācību projekts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Mācību projekts</h1>
</header>

<main>

    <section class="box">
        <h2>Teksta maiņa</h2>
        <p id="text"></p>
        <input type="text" id="nameInput">
        <br><br>
        <button id="addBtn">Pievienot</button>
        <button id="removeBtn">Noņemt</button>
    </section>

    <section class="box">
        <h2>Reģistrācija</h2>
        <form id="myForm">
            <input type="text" id="formName">
            <input type="text" id="email">
            <button type="submit">OK</button>
            <p id="error"></p>
        </form>
    </section>

    <section class="box">
        <h2>Produkts</h2>
        <input id="quantity" type="number" min="1">
        <button id="calcBtn">Aprēķināt</button>
        <div id="result" class="result"></div>
    </section>

</main>

<footer>
    <p>© 2026</p>
</footer>

<script src="script.js"></script>
</body>
</html>
