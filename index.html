<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <title>Mācību projekts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Mācību projekts</h1>
</header>

<main>

    <section class="box">
        <h2>Teksta maiņa</h2>
        <p id="text">Šis ir sākotnējais teksts.</p>

        <input type="text" id="nameInput" placeholder="Ievadi savu vārdu">

        <br><br>

        <button id="addBtn">Pievienot elementu</button>
        <button id="removeBtn">Noņemt elementu</button>
    </section>


    <section class="box">
        <h2>Reģistrācijas forma</h2>

        <form id="myForm">
            <input type="text" id="formName" placeholder="Vārds"><br><br>
            <input type="text" id="email" placeholder="E-pasts"><br><br>
            <button type="submit">Iesniegt</button>
            <p id="error"></p>
        </form>
    </section>


    <section class="box">
        <h2>Produkta pasūtīšana</h2>

        <input id="quantity" type="number" placeholder="Daudzums" min="1">
        <button id="calcBtn">Aprēķināt cenu</button>

        <div id="result" class="result"></div>
    </section>

</main>

<footer>
    <p>© 2026 Mācību projekts</p>
</footer>

<script src="script.js"></script>
</body>
</html>
